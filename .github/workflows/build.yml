name: FreeTab Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build FreeTab Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Cache Wails CLI
        uses: actions/cache@v4
        id: cache-wails-win
        with:
          path: ~\go\bin\wails.exe
          key: ${{ runner.os }}-wails-v2

      - name: Install Wails CLI
        if: steps.cache-wails-win.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build FreeTab Windows Executable
        run: wails build -platform windows/amd64 -s -o FreeTab.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTab-v1.2-Windows-amd64
          path: build/bin/FreeTab.exe

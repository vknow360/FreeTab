name: FreeTab Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build FreeTab Windows Executable
        run: wails build -platform windows/amd64 -s -o FreeTab.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTab-Windows-amd64
          path: build/bin/FreeTab.exe

  build-linux:
    name: Build Linux GUI (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build FreeTab Linux Binary
        run: wails build -platform linux/amd64 -s -o FreeTab

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTab-Linux-amd64
          path: build/bin/FreeTab

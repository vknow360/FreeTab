name: FreeTab Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to compile'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - windows
          - linux

jobs:
  build-windows:
    name: Build Windows (amd64)
    if: inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Cache Wails CLI
        uses: actions/cache@v4
        id: cache-wails-win
        with:
          path: ~\go\bin\wails.exe
          key: ${{ runner.os }}-wails-v2

      - name: Install Wails CLI
        if: steps.cache-wails-win.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build FreeTab Windows Executable
        run: wails build -platform windows/amd64 -s -o FreeTab.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTab-Windows-amd64
          path: build/bin/FreeTab.exe

  build-linux:
    name: Build Linux GUI (amd64)
    if: inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Cache Wails CLI
        uses: actions/cache@v4
        id: cache-wails-linux
        with:
          path: ~/go/bin/wails
          key: ${{ runner.os }}-wails-v2

      - name: Install Wails CLI
        if: steps.cache-wails-linux.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build FreeTab Linux Binary
        run: wails build -platform linux/amd64 -tags "webkit2_41" -s -o FreeTab

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTab-Linux-amd64
          path: build/bin/FreeTab
